[package]
name = "x402-nockchain-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Nockchain-specific x402 wrapper around vesl-signing's canonical Schnorr-over-Cheetah primitives. `Authorization` digesting, `x402_client::Signer` impl, payload verification."

[dependencies]
# Canonical signing primitives lifted to vesl-signing in Phase 0 W3
# (per `vesl-labs/docs/plans/shared-infrastructure/10-PHASE-0-NOW.md`).
vesl-signing = { workspace = true }

# x402 protocol crates (network-neutral upstream + this crate's consumers).
x402-types = { workspace = true }
x402-client = { workspace = true }

# Async runtime + traits — required by the `Signer` impl.
anyhow = { workspace = true }
async-trait = { workspace = true }

# Used directly by `sign_message.rs` for base58 PKH encoding (separate
# from vesl-signing's bs58 usage in CheetahPoint serialization).
bs58 = "0.5"
ibig = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Async runtime for `#[tokio::test]`-flagged integration tests
# (`tests/golden.rs`) and the `gen_golden` example. The lib itself
# does not require tokio — the `Signer` trait impl is `async-trait`.
tokio = { workspace = true }
